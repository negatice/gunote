<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuNote – Login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #eef2ff;
      --bg: #f1f5f9; --surface: #ffffff; --text: #0f172a;
      --text-sub: #64748b; --border: #e2e8f0; --input-bg: #f8fafc;
      --error: #dc2626;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9;
      --text-sub: #94a3b8; --border: #334155; --input-bg: #0f172a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* Header */
    .login-header {
      background: var(--surface); padding: 14px 24px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .login-header .logo { font-size: 22px; }
    .login-header h1 { color: var(--primary); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

    /* Main */
    .login-main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    .login-card {
      background: var(--surface); border-radius: 20px;
      box-shadow: 0 4px 40px rgba(79,70,229,.08), 0 1px 3px rgba(0,0,0,.06);
      padding: 36px 32px; width: 100%; max-width: 400px;
      border: 1px solid var(--border);
    }

    /* Tabs */
    .auth-tabs { display: flex; gap: 0; margin-bottom: 28px; border-bottom: 2px solid var(--border); }
    .auth-tab {
      flex: 1; padding: 10px; text-align: center; font-size: 15px; font-weight: 600;
      cursor: pointer; background: none; border: none; color: var(--text-sub);
      border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s;
    }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* Form */
    .auth-form { display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 12px; font-weight: 700; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: .6px;
    }
    .form-group input {
      padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--input-bg); color: var(--text); font-size: 16px;
      font-family: inherit; outline: none; transition: border-color .2s, background .2s;
    }
    .form-group input:focus { border-color: var(--primary); background: var(--surface); }
    .form-group input::placeholder { color: var(--text-sub); }

    /* Submit */
    .submit-btn {
      padding: 12px; border-radius: 10px; border: none; cursor: pointer;
      background: var(--primary); color: white; font-size: 16px; font-weight: 700;
      font-family: inherit; transition: all .15s; margin-top: 4px; letter-spacing: .2px;
    }
    .submit-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    /* Error / Success */
    .alert {
      padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 500;
      display: none; margin-bottom: 4px;
    }
    .alert.error   { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    [data-theme="dark"] .alert.error   { background: #2a0a0a; color: #fca5a5; border-color: #7f1d1d; }
    [data-theme="dark"] .alert.success { background: #052e16; color: #86efac; border-color: #14532d; }

    /* Footer */
    .login-footer {
      text-align: center; padding: 20px; color: var(--text-sub); font-size: 13px;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block; width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: white;
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body data-theme="light">

<header class="login-header">
  <span class="logo"></span>
  <h1>Gunote</h1>
</header>

<main class="login-main">
  <div class="login-card">

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Masuk</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Daftar</button>
    </div>

    <!-- Alert -->
    <div class="alert" id="alert"></div>

    <!-- Login Form -->
    <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="email@kamu.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">Masuk</button>
    </form>

    <!-- Register Form -->
    <form class="auth-form" id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="regName" placeholder="Nama kamu" required autocomplete="name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="email@kamu.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password <span style="font-weight:400;text-transform:none">(min. 6 karakter)</span></label>
        <input type="password" id="regPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="submit-btn" id="registerBtn">Buat Akun</button>
    </form>

  </div>
</main>

<footer class="login-footer">GuNote &copy; 2026 · Notes, Todo & Keuangan</footer>

<script src="js/api.js"></script>
<script>
  // Redirect jika sudah login
  if (Auth.isLoggedIn()) window.location.replace('/');

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    document.getElementById('loginForm').style.display    = isLogin ? 'flex' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : 'flex';
    hideAlert();
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert ' + type;
    el.style.display = 'block';
  }
  function hideAlert() {
    document.getElementById('alert').style.display = 'none';
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading
      ? '<span class="spinner"></span>Memproses...'
      : (btnId === 'loginBtn' ? 'Masuk' : 'Buat Akun');
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideAlert();
    const email    = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    setLoading('loginBtn', true);
    try {
      const { token, user } = await API.auth.login(email, password);
      Auth.setToken(token);
      Auth.setUser(user);
      window.location.replace('/');
    } catch (err) {
      showAlert(err.message);
    } finally {
      setLoading('loginBtn', false);
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    hideAlert();
    const name     = document.getElementById('regName').value;
    const email    = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    setLoading('registerBtn', true);
    try {
      const { token, user } = await API.auth.register(name, email, password);
      Auth.setToken(token);
      Auth.setUser(user);
      showAlert('Akun berhasil dibuat! Mengalihkan...', 'success');
      setTimeout(() => { window.location.replace('/'); }, 1200);
    } catch (err) {
      showAlert(err.message);
    } finally {
      setLoading('registerBtn', false);
    }
  }
</script>
</body>
</html>
